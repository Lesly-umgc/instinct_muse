name: e2e
# Real end-to-end test of the installed app on a Mac runner: build the DMG,
# install it like a user, install OpenCode, launch the app, and drive real
# chats through the app's own API + websocket. No user testing required.
on:
  workflow_dispatch:
  push:
    branches: [e2e-harness]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Build Python service (unpacked onedir)
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          cd ui && npm ci && npm run build && cd ..
          pyinstaller --onedir --clean --name muse-service --add-data 'ui/dist:ui/dist' --collect-all uvicorn --collect-all pydantic --collect-all pydantic_settings --collect-all fastapi --collect-all starlette app/desktop.py
          test -x dist/muse-service/muse-service
      - name: Build ad-hoc signed Mac app and DMG
        run: cd ui && npx tauri build --target aarch64-apple-darwin
      - name: Repack app with service and sign everything in one pass
        shell: bash
        run: |
          set -euo pipefail
          dmg=(ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          mount_dir="$RUNNER_TEMP/tauri-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}"
          mkdir -p "$RUNNER_TEMP/repack"
          app="$RUNNER_TEMP/repack/Instinct Muse.app"
          cp -R "$mount_dir/Instinct Muse.app" "$app"
          hdiutil detach "$mount_dir"
          cp -R dist/muse-service "$app/Contents/Resources/muse-service"
          find "$app/Contents/Resources/muse-service" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 |
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
            fi
          done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          version="$(python3 -c 'import json;print(json.load(open("ui/src-tauri/tauri.conf.json"))["version"])')"
          final_root="$RUNNER_TEMP/final-dmg"
          mkdir -p "$final_root"
          cp -R "$app" "$final_root/"
          ln -s /Applications "$final_root/Applications"
          mkdir -p dist/release
          hdiutil create -volname "Instinct Muse" -srcfolder "$final_root" -ov -format UDZO "dist/release/Instinct Muse_${version}_aarch64.dmg"
          ls -lh dist/release/
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-dmg
          path: dist/release/*.dmg
          retention-days: 3
  test:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: muse-dmg
          path: /tmp/muse-dmg
      - name: Install OpenCode CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 https://opencode.ai/install | bash -s -- --version 1.18.32; then ok=1; break; fi
            echo "opencode install attempt $i failed, retrying in 15s"
            sleep 15
          done
          test "$ok" = 1
          "$HOME/.opencode/bin/opencode" --version
      - name: Install the app like a user
        run: |
          set -euo pipefail
          dmg=(/tmp/muse-dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          mount_dir="$RUNNER_TEMP/muse-mounted"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}"
          ls -la "$mount_dir"
          ls -la "$mount_dir/Instinct Muse.app/Contents" || echo 'APP CONTENTS MISSING IN DMG'
          mkdir -p "$HOME/Applications"
          ditto "$mount_dir/Instinct Muse.app" "$HOME/Applications/Instinct Muse.app"
          hdiutil detach "$mount_dir"
          xattr -dr com.apple.quarantine "$HOME/Applications/Instinct Muse.app" 2>/dev/null || true
          ls "$HOME/Applications/Instinct Muse.app/Contents/MacOS"
      - name: Driver dependencies
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install --quiet websockets
      - name: Launch app and wait for service
        run: |
          open -a "$HOME/Applications/Instinct Muse.app"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18764/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:18764/health | grep -q instinct_muse
      - name: E2E main stage (chat, title, artifact, delete, CORS)
        run: /tmp/e2e-venv/bin/python e2e/driver.py --stage main
      - name: Screenshot after chat
        run: |
          mkdir -p /tmp/shots
          screencapture -x /tmp/shots/01-after-chat.png || echo 'screencapture failed'
      - name: Restart stage - arm, kill, relaunch
        run: |
          /tmp/e2e-venv/bin/python e2e/driver.py --stage arm-restart
          (sleep 1; pkill -f 'Instinct Muse' || true; pkill -f muse-service || true) &
          sleep 4
          pgrep -fl 'muse-service' || echo 'service down as expected'
          open -a "$HOME/Applications/Instinct Muse.app"
          sleep 3
      - name: E2E post-restart stage
        run: /tmp/e2e-venv/bin/python e2e/driver.py --stage post-restart
      - name: Final screenshot
        if: always()
        run: |
          mkdir -p /tmp/shots
          screencapture -x /tmp/shots/02-final.png || echo 'screencapture failed'
      - name: Screenshot every UI screen
        if: always()
        run: |
          mkdir -p /tmp/shots
          bin="$HOME/Applications/Instinct Muse.app/Contents/MacOS/instinct-muse"
          base=http://127.0.0.1:18764
          pyx() { /tmp/e2e-venv/bin/python -c "$1"; }
          jid() { /tmp/e2e-venv/bin/python -c 'import sys,json; print(json.load(sys.stdin)["id"])'; }
          # data for state shots (service is up from the e2e stages)
          goal_id=$(curl -sf -X POST $base/api/goals -H 'Content-Type: application/json' -d '{"title":"Train for a 10k","category":"Health"}' | jid 2>/dev/null || true)
          # showcase conversation with a real reply for the chat screenshot
          cid=$(curl -sf -X POST $base/api/conversations -H 'Content-Type: application/json' -d '{"title":"Weekend plans","engine":"opencode_server","model":"opencode/muse-spark-1.3-contributor-free"}' | jid 2>/dev/null || true)
          if [ -n "$cid" ]; then
            /tmp/e2e-venv/bin/python - "$cid" <<'PYEOF' || true
          import asyncio, sys
          sys.path.insert(0, "e2e")
          import driver
          cid = sys.argv[1]
          try:
              asyncio.run(driver.ws_turn("http://127.0.0.1:18764", cid, "Suggest one fun weekend activity in Toronto. One sentence."))
              print("showcase turn ok")
          except Exception as e:
              print("showcase turn failed:", e)
          PYEOF
          fi
          echo "showcase cid: $cid / goal: $goal_id"
          # mid-stream capture: open an empty chat, then fire a slow prompt while it is open
          cid2=$(curl -sf -X POST $base/api/conversations -H 'Content-Type: application/json' -d '{"title":"Streaming demo","engine":"opencode_server","model":"opencode/muse-spark-1.3-contributor-free"}' | jid 2>/dev/null || true)
          pkill -f 'Instinct Muse' || true
          pkill -f muse-service || true
          sleep 2
          if [ -n "$cid2" ]; then
            MUSE_INITIAL_SCREEN=chat MUSE_INITIAL_CHAT=$cid2 "$bin" >/dev/null 2>&1 &
            sleep 10
            /tmp/e2e-venv/bin/python - "$cid2" <<'PYEOF' &
          import asyncio, sys, json, websockets
          async def go(cid):
              try:
                  async with websockets.connect("ws://127.0.0.1:18764/ws/conversations/" + cid) as ws:
                      await ws.send(json.dumps({"type": "message", "text": "Count from 1 to 200, one number per line."}))
                      await asyncio.sleep(90)
              except Exception as e:
                  print("stream prompt failed:", e)
          asyncio.run(go(sys.argv[1]))
          PYEOF
            sleep 1.5
            screencapture -x /tmp/shots/ui-chat-thinking.png || echo 'thinking shot failed'
            sleep 5
            screencapture -x /tmp/shots/ui-chat-streaming.png || echo 'stream shot failed'
            sleep 25
          fi
          # error banner
          pkill -f 'Instinct Muse' || true
          pkill -f muse-service || true
          sleep 2
          MUSE_INITIAL_SCREEN=chat MUSE_FORCE_ERROR=1 "$bin" >/dev/null 2>&1 &
          sleep 8
          screencapture -x /tmp/shots/ui-chat-error.png || echo 'error shot failed'
          # standard per-screen loop
          for scr in chat feed ideas goals library search settings; do
            pkill -f 'Instinct Muse' || true
            pkill -f muse-service || true
            sleep 2
            if [ "$scr" = chat ] && [ -n "$cid" ]; then
              MUSE_INITIAL_SCREEN=$scr MUSE_INITIAL_CHAT=$cid "$bin" >/dev/null 2>&1 &
            else
              MUSE_INITIAL_SCREEN=$scr "$bin" >/dev/null 2>&1 &
            fi
            sleep 8
            screencapture -x "/tmp/shots/ui-$scr.png" || echo "screencapture $scr failed"
          done
          pkill -f 'Instinct Muse' || true
          # modal + results deep links
          art_id=$(curl -sf $base/api/artifacts | /tmp/e2e-venv/bin/python -c 'import sys,json; a=json.load(sys.stdin)["artifacts"]; print(a[0]["id"] if a else "")' 2>/dev/null || true)
          echo "artifact for preview: $art_id"
          if [ -n "$goal_id" ]; then
            pkill -f 'Instinct Muse' || true; pkill -f muse-service || true; sleep 2
            MUSE_INITIAL_SCREEN=goals MUSE_INITIAL_GOAL=$goal_id "$bin" >/dev/null 2>&1 &
            sleep 8
            screencapture -x /tmp/shots/ui-goal-detail.png || echo 'goal shot failed'
          fi
          if [ -n "$art_id" ]; then
            pkill -f 'Instinct Muse' || true; pkill -f muse-service || true; sleep 2
            MUSE_INITIAL_SCREEN=library MUSE_INITIAL_ARTIFACT=$art_id "$bin" >/dev/null 2>&1 &
            sleep 8
            screencapture -x /tmp/shots/ui-artifact-preview.png || echo 'artifact shot failed'
          fi
          pkill -f 'Instinct Muse' || true; pkill -f muse-service || true; sleep 2
          MUSE_INITIAL_SCREEN=search MUSE_INITIAL_SEARCH=weekend "$bin" >/dev/null 2>&1 &
          sleep 8
          screencapture -x /tmp/shots/ui-search-results.png || echo 'search shot failed'
          # feed edition: generate with the app (and service) kept alive, then shoot
          pkill -f 'Instinct Muse' || true; pkill -f muse-service || true; sleep 2
          MUSE_INITIAL_SCREEN=feed "$bin" >/dev/null 2>&1 &
          sleep 6
          curl -sf -X POST $base/api/feed/refresh || true
          for i in $(seq 1 48); do
            n=$(curl -sf $base/api/feed | /tmp/e2e-venv/bin/python -c 'import sys,json; print(len(json.load(sys.stdin)["editions"]))' 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] && break
            [ "$i" = 24 ] && curl -sf -X POST $base/api/feed/refresh || true
            sleep 5
          done
          echo "feed editions: $n"
          pkill -f 'Instinct Muse' || true; pkill -f muse-service || true; sleep 2
          MUSE_INITIAL_SCREEN=feed "$bin" >/dev/null 2>&1 &
          sleep 8
          screencapture -x /tmp/shots/ui-feed-edition.png || echo 'feed edition shot failed'
          # every settings section
          for sec in general connectors filesystem dictation wallet securestore permissions messaging devices data help legal; do
            pkill -f 'Instinct Muse' || true
            pkill -f muse-service || true
            sleep 2
            MUSE_INITIAL_SCREEN=settings MUSE_SETTINGS_SECTION=$sec "$bin" >/dev/null 2>&1 &
            sleep 8
            screencapture -x "/tmp/shots/ui-settings-$sec.png" || echo "screencapture settings-$sec failed"
          done
          pkill -f 'Instinct Muse' || true
      - name: Collect service logs
        if: always()
        run: cp /Users/runner/.instinct_muse/*.log /tmp/shots/ 2>/dev/null || true
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          include-hidden-files: true
          path: |
            /tmp/shots/
            /Users/runner/.instinct_muse/*.log
          retention-days: 7
