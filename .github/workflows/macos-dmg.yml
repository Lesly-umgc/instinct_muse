name: macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'ui/**', 'pyproject.toml', '.github/workflows/macos-dmg.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Build Python service (unpacked onedir)
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          cd ui && npm ci && npm run build && cd ..
          # Ship the service UNPACKED (--onedir), never --onefile. A onefile
          # binary extracts Python.framework at runtime, and that extracted
          # library keeps a signature whose Team ID differs from the ad-hoc
          # signed app, so macOS kills it on launch:
          # "mapping process and mapped file (non-platform) have different Team IDs".
          pyinstaller --onedir --clean --name muse-service --add-data 'ui/dist:ui/dist' --collect-all uvicorn --collect-all pydantic --collect-all pydantic_settings --collect-all fastapi --collect-all starlette app/desktop.py
          test -x dist/muse-service/muse-service
      - name: Build ad-hoc signed Mac app and DMG
        run: cd ui && npx tauri build --target aarch64-apple-darwin
      - name: Repack app with service and sign everything in one pass
        shell: bash
        run: |
          set -euo pipefail
          # Tauri removes the intermediate .app after wrapping the DMG, so take
          # the app out of the DMG it just built.
          dmg=(ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          test -s "${dmg[0]}"
          mount_dir="$RUNNER_TEMP/tauri-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}"
          mkdir -p "$RUNNER_TEMP/repack"
          app="$RUNNER_TEMP/repack/Instinct Muse.app"
          cp -R "$mount_dir/Instinct Muse.app" "$app"
          hdiutil detach "$mount_dir"
          # Place the unpacked service in Resources. Contents/MacOS only
          # accepts code bundles (the onedir payload has dist-info data dirs,
          # which make codesign fail with "bundle format unrecognized"), while
          # Resources content is sealed as data.
          cp -R dist/muse-service "$app/Contents/Resources/muse-service"
          # Sign inside out with one ad-hoc identity: every Mach-O in the
          # service first, then the whole bundle. After this pass every mapped
          # file shares the app's Team ID, so the runtime check passes.
          find "$app/Contents/Resources/muse-service" -type f \( -name '*.dylib' -o -name '*.so' -o -perm +111 \) -print0 |
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              codesign --force --sign - "$f"
            fi
          done
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          # Build the final DMG from the fully re-signed app.
          version="$(python3 -c 'import json;print(json.load(open("ui/src-tauri/tauri.conf.json"))["version"])')"
          final_root="$RUNNER_TEMP/final-dmg"
          mkdir -p "$final_root"
          cp -R "$app" "$final_root/"
          ln -s /Applications "$final_root/Applications"
          mkdir -p dist/release
          hdiutil create -volname "Instinct Muse" -srcfolder "$final_root" -ov -format UDZO "dist/release/Instinct Muse_${version}_aarch64.dmg"
          ls -lh dist/release/
      - name: Smoke test installed app payload before publishing
        shell: bash
        run: |
          set -euo pipefail
          # Mount the final re-signed DMG and test exactly what the user installs.
          dmg=(dist/release/*.dmg)
          test "${#dmg[@]}" -eq 1
          test -s "${dmg[0]}"
          mount_dir="$RUNNER_TEMP/muse-mounted"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}"
          app="$RUNNER_TEMP/Instinct Muse.app"
          cp -R "$mount_dir/Instinct Muse.app" "$app"
          hdiutil detach "$mount_dir"
          sidecar="$app/Contents/Resources/muse-service/muse-service"
          ls -la "$app/Contents/MacOS" "$app/Contents/Resources/muse-service"
          test -x "$sidecar"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$sidecar"
          # Test the actual signed service inside the built .app, not a source/dev server.
          "$sidecar" > /tmp/muse-smoke.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true; cat /tmp/muse-smoke.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'; then
              curl --fail --silent http://127.0.0.1:18764/api/engines | python -m json.tool > /tmp/muse-engines.json
              cat /tmp/muse-engines.json
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null; then echo 'service exited early'; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'
          kill "$service_pid" 2>/dev/null || true
          wait "$service_pid" 2>/dev/null || true
          # Also launch the packaged shell so missing permissions/sidecar paths
          # fail CI, rather than just validating the service in isolation.
          rm -f "$HOME/.instinct_muse/desktop.log"
          "$app/Contents/MacOS/instinct-muse" > /tmp/muse-shell.log 2>&1 &
          shell_pid=$!
          trap 'kill "$shell_pid" 2>/dev/null || true; cat /tmp/muse-shell.log; cat "$HOME/.instinct_muse/desktop.log" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if grep -q 'service spawned' "$HOME/.instinct_muse/desktop.log" 2>/dev/null &&
              curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'; then
              exit 0
            fi
            if ! kill -0 "$shell_pid" 2>/dev/null; then echo 'desktop shell exited early'; exit 1; fi
            sleep 1
          done
          echo 'desktop shell did not start the service'; exit 1
      - name: Publish tested DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.3-mac dist/release/*.dmg \
            --title 'Instinct Muse v0.1.3 Mac (ad-hoc signed)' --prerelease \
            --notes 'Apple Silicon only. Ad-hoc signed, not notarized: right-click Open or allow in Privacy & Security on first launch. Chat fixes: replies can no longer be lost by connection churn (the client keeps one stable socket per chat and the service persists every reply and error before broadcasting, so a reopened chat always shows them); permission prompts from OpenCode flow again via its event stream; chats are auto-titled from your first message; chats can be deleted (hover a chat, click the x, confirm); the reply timeout is 5 minutes instead of 2. OpenCode must be installed and logged in for local chat.'
