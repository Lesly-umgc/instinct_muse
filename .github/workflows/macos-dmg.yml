name: macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'ui/**', 'pyproject.toml', '.github/workflows/macos-dmg.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Build Python service
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          cd ui && npm ci && npm run build && cd ..
          pyinstaller --onefile --clean --name muse-service --add-data 'ui/dist:ui/dist' --collect-all uvicorn --collect-all pydantic --collect-all pydantic_settings --collect-all fastapi --collect-all starlette app/desktop.py
          mkdir -p ui/src-tauri/binaries
          cp dist/muse-service ui/src-tauri/binaries/muse-service-aarch64-apple-darwin
          chmod +x ui/src-tauri/binaries/muse-service-aarch64-apple-darwin
      - name: Build ad-hoc signed Mac app and DMG
        run: cd ui && npx tauri build --target aarch64-apple-darwin
      - name: Smoke test installed app payload before publishing
        shell: bash
        run: |
          set -euo pipefail
          # Tauri removes the intermediate .app after bundling. Mount the DMG
          # and test precisely what the user will install.
          dmg=(ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          test -s "${dmg[0]}"
          mount_dir="$RUNNER_TEMP/muse-mounted"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}"
          app="$RUNNER_TEMP/Instinct Muse.app"
          cp -R "$mount_dir/Instinct Muse.app" "$app"
          hdiutil detach "$mount_dir"
          sidecar="$app/Contents/MacOS/muse-service"
          ls -la "$app/Contents/MacOS"
          test -x "$sidecar"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$sidecar"
          # Test the actual signed sidecar inside the built .app, not a source/dev server.
          "$sidecar" > /tmp/muse-smoke.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true; cat /tmp/muse-smoke.log' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'; then
              curl --fail --silent http://127.0.0.1:18764/api/engines | python -m json.tool > /tmp/muse-engines.json
              cat /tmp/muse-engines.json
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null; then echo 'service exited early'; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'
          ls -lh ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/
          for dmg in ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do test -s "$dmg"; done
          kill "$service_pid" 2>/dev/null || true
          wait "$service_pid" 2>/dev/null || true
          # Also launch the packaged shell so missing permissions/sidecar paths
          # fail CI, rather than just validating the service in isolation.
          rm -f "$HOME/.instinct_muse/desktop.log"
          "$app/Contents/MacOS/instinct-muse" > /tmp/muse-shell.log 2>&1 &
          shell_pid=$!
          trap 'kill "$shell_pid" 2>/dev/null || true; cat /tmp/muse-shell.log; cat "$HOME/.instinct_muse/desktop.log" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if grep -q 'service spawned' "$HOME/.instinct_muse/desktop.log" 2>/dev/null &&
              curl --fail --silent http://127.0.0.1:18764/health | grep -q '"system":"instinct_muse"'; then
              exit 0
            fi
            if ! kill -0 "$shell_pid" 2>/dev/null; then echo 'desktop shell exited early'; exit 1; fi
            sleep 1
          done
          echo 'desktop shell did not start the service'; exit 1
      - name: Publish tested DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.1-mac ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            --title 'Instinct Muse v0.1.1 Mac (ad-hoc signed)' --prerelease \
            --notes 'Apple Silicon only. Ad-hoc signed, not notarized: right-click Open or allow in Privacy & Security on first launch. Bundled service verified from packaged app. OpenCode must be installed and logged in for local chat.'
