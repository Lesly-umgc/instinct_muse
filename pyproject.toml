[project]
name = "instinct-muse"
version = "0.1.0"
description = "Open-source personal AI agent inspired by Meta's Muse: sandboxed agent, credential broker, egress gate, browser worker."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "asyncpg>=0.29",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app", "broker", "browser"]
